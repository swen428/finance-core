name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      d4_sqlite_f0_probe:
        description: "Run synthetic upstream SQLite F0 inventory diagnostic"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  CANDIDATE_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}

concurrency:
  group: finance-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bridge: ${{ steps.scope.outputs.bridge }}
      identity: ${{ steps.identity.outputs.identity }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify candidate checkout identity
        id: identity
        run: python .github/scripts/candidate_identity.py --output "$RUNNER_TEMP/candidate-identity.json" --github-output "$GITHUB_OUTPUT"

      - name: Classify Bridge scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if test "$EVENT_NAME" = "push" || test "$EVENT_NAME" = "workflow_dispatch" || \
             test -z "$BASE_SHA" || \
             printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            echo 'bridge=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_paths="$RUNNER_TEMP/finance-core-changed-paths.txt"
          git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"
          if grep -Eq '^(\.github/|scripts/|pyproject\.toml$|requirements-dev\.txt$|MANIFEST\.in$|plugins/finance-bridge/|native/|finance_core/(openclaw_staging_bridge|application/|intake/(__init__\.py$|macos_vision_receipt_ocr|receipt_media\.py$|_receipt_media_worker\.py$|receipt_ocr_evidence\.py$|receipt_ocr_proposal\.py$|tesseract_resources\.py$)|parser_proposals/(__init__\.py$|receipt_total_parser\.py$|ai_))|tests/(test_receipt_media(_vectors)?_v1\.py$|fixtures/receipt_media_v1/|test_receipt_total_parser_hierarchy_v2\.py$|fixtures/receipt_total_parser_v2/|test_tesseract_pinned_resources_v1\.py$|test_linux_receipt_ocr_acceptance_v1\.py$|test_receipt_ocr_evidence\.py$|test_openclaw_staging_bridge_ocr_production_boundary_v1\.py$|fixtures/linux_receipt_ocr/))' "$changed_paths"; then
            echo 'bridge=true' >> "$GITHUB_OUTPUT"
          else
            echo 'bridge=false' >> "$GITHUB_OUTPUT"
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify candidate checkout identity
        id: identity
        run: python .github/scripts/candidate_identity.py --output "$RUNNER_TEMP/candidate-identity.json" --github-output "$GITHUB_OUTPUT"

      - name: Install locked development dependencies
        run: "python -I -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt"

      - name: Run Python quality checks
        run: |
          ruff check --exclude finance_core/resources/preflight/migration_029_preflight.py finance_core tests
          ruff format --check --exclude finance_core/resources/preflight/migration_029_preflight.py finance_core tests
          mypy finance_core

      - name: Collect synthetic SQLite baseline inventory
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.d4_sqlite_f0_probe == true }}
        run: |
          mkdir -p "$RUNNER_TEMP/d4-sqlite-f0-probe"
          cp "$RUNNER_TEMP/candidate-identity.json" \
            "$RUNNER_TEMP/d4-sqlite-f0-probe/candidate-identity.json"
          python .github/scripts/d4_sqlite_f0_probe.py \
            --output-dir "$RUNNER_TEMP/d4-sqlite-f0-probe"

      - name: Upload synthetic diagnostic evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.d4_sqlite_f0_probe == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: d4-sqlite-f0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d4-sqlite-f0-probe/
          retention-days: 30
          if-no-files-found: warn

  pytest:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify Linux validation platform
        run: |
          python - <<'PY_PLATFORM'
          import platform
          import sys
          identity = platform.freedesktop_os_release()
          if (sys.platform, platform.machine(), identity.get("ID"), identity.get("VERSION_ID")) != ("linux", "x86_64", "ubuntu", "24.04"):
              raise SystemExit("Linux validation requires Ubuntu 24.04 x86_64")
          print("Verified Linux validation platform: Ubuntu 24.04 x86_64")
          PY_PLATFORM

      - name: Verify candidate checkout identity
        id: identity
        run: python .github/scripts/candidate_identity.py --output "$RUNNER_TEMP/candidate-identity.json" --github-output "$GITHUB_OUTPUT"

      - name: Install locked development dependencies
        run: "python -I -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt"

      - name: Plan exact test inventory
        run: |
          python .github/scripts/plan_pytest_shards.py plan \
            --baseline .github/scripts/pytest-shard-weights-v2.json \
            --repository-root . \
            --output-dir /tmp/finance-core-shards \
            --shard-count 4

      - name: Run shard
        id: pytest
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set +e
          xargs python -I -m pytest -q \
            --junitxml="/tmp/pytest-results-shard-${SHARD_INDEX}.xml" \
            --durations=25 --durations-min=1.0 \
            < "/tmp/finance-core-shards/shard-${SHARD_INDEX}.txt"
          rc=$?
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Report shard timing
        if: ${{ always() }}
        continue-on-error: true
        env:
          PYTEST_EXIT_CODE: ${{ steps.pytest.outputs.exit_code }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          mkdir -p /tmp/finance-core-timing
          python .github/scripts/report_pytest_timing.py \
            --xml "/tmp/pytest-results-shard-${SHARD_INDEX}.xml" \
            --output "/tmp/finance-core-timing/shard-${SHARD_INDEX}.json" \
            --exit-code "${PYTEST_EXIT_CODE:-1}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload shard timing
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-timing-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/finance-core-timing/
          retention-days: 90
          if-no-files-found: ignore

  bridge:
    needs: classify
    if: ${{ needs.classify.outputs.bridge == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: macos-15
            runner: macos-15
    name: bridge (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "${{ runner.os == 'Linux' && '3.12.14' || '3.12.10' }}"

      - name: Verify Linux validation platform
        if: runner.os == 'Linux'
        run: |
          python - <<'PY_PLATFORM'
          import platform
          import sys
          identity = platform.freedesktop_os_release()
          if (sys.platform, platform.machine(), identity.get("ID"), identity.get("VERSION_ID")) != ("linux", "x86_64", "ubuntu", "24.04"):
              raise SystemExit("Linux validation requires Ubuntu 24.04 x86_64")
          print("Verified Linux validation platform: Ubuntu 24.04 x86_64")
          PY_PLATFORM

      - name: Verify candidate checkout identity
        id: identity
        run: python .github/scripts/candidate_identity.py --output "$RUNNER_TEMP/candidate-identity.json" --github-output "$GITHUB_OUTPUT"

      - name: Install locked Python dependencies
        run: |
          python -I -m venv .venv
          .venv/bin/python -I -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt

      - name: Prepare pinned Linux OCR acceptance assets
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr acl
          .venv/bin/python -I scripts/prepare_linux_ocr.py \
            --executable /usr/bin/tesseract \
            --destination "$RUNNER_TEMP/linux-ocr"

      - name: Require actual Linux receipt OCR acceptance
        if: runner.os == 'Linux'
        env:
          FINANCE_LINUX_OCR_REQUIRED: "1"
          FINANCE_LINUX_OCR_CONFIG: ${{ runner.temp }}/linux-ocr/ocr_engine.json
        run: |
          .venv/bin/python -I -m pytest -q tests/test_linux_receipt_ocr_acceptance_v1.py \
            --junitxml="$RUNNER_TEMP/linux-ocr-acceptance.xml" --durations=15
          .venv/bin/python -I - "$RUNNER_TEMP/linux-ocr-acceptance.xml" <<'PY_OCR_PROOF'
          import sys
          import xml.etree.ElementTree as ET
          suites = list(ET.parse(sys.argv[1]).getroot().iter("testsuite"))
          totals = {key: sum(int(suite.get(key, "0")) for suite in suites) for key in ("tests", "skipped", "failures", "errors")}
          if totals["tests"] < 13 or any(totals[key] for key in ("skipped", "failures", "errors")):
              raise SystemExit("Actual Linux OCR requires at least 13 executed tests and zero skips/errors")
          print("Actual Linux OCR acceptance:", totals)
          PY_OCR_PROOF

      - name: Preserve actual Linux OCR acceptance evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-ocr-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/linux-ocr/preparation-receipt.json
            ${{ runner.temp }}/linux-ocr-preparation-failure.json
            ${{ runner.temp }}/linux-ocr-acceptance.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Prepare isolated media candidate snapshot and runtime
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if getent passwd financemedia; then
            echo "The synthetic media account must be fresh" >&2
            exit 1
          fi
          for value in "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"; do
            case "$value" in ''|*[!0-9]*) exit 1 ;; esac
          done
          media_root="/opt/finance-media-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$media_root" && test ! -L "$media_root"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          source_tree="$(git rev-parse "$CANDIDATE_SHA^{tree}")"
          archive="$RUNNER_TEMP/finance-media-candidate.tar"
          inventory="$RUNNER_TEMP/finance-media-candidate-tree.bin"
          commit_object="$RUNNER_TEMP/finance-media-candidate-commit.bin"
          git -c tar.umask=0022 archive --format=tar --output "$archive" "$CANDIDATE_SHA"
          git ls-tree -r -z --full-tree "$CANDIDATE_SHA" > "$inventory"
          git cat-file commit "$CANDIDATE_SHA" > "$commit_object"
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin financemedia
          sudo install -d -m 0755 -o root -g root "$media_root"
          sudo install -d -m 0700 -o financemedia -g financemedia "$media_root/work"
          sudo "$GITHUB_WORKSPACE/.venv/bin/python" -I -B - "$archive" "$inventory" "$media_root/source" "$media_root/snapshot.json" "$CANDIDATE_SHA" "$source_tree" "$GITHUB_WORKSPACE/.venv/bin/python" "$commit_object" <<'PY_MEDIA_SNAPSHOT'
          import hashlib
          import io
          import json
          import os
          import re
          import stat
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          MAX_ARCHIVE = 134_217_728
          MAX_MEMBERS = 8192
          MAX_FILE = 20_000_000

          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode()

          def write_receipt(path, value):
              raw = canonical(value)
              if len(raw) > 65_536:
                  raise ValueError("Snapshot receipt exceeded bound")
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, "wb") as stream:
                  stream.write(raw)
                  stream.flush()
                  os.fsync(stream.fileno())
                  os.fchmod(stream.fileno(), 0o400)

          def safe_name(name):
              if not isinstance(name, str) or not name or len(name) > 4096 or "\\" in name or any(ord(c) < 32 for c in name):
                  raise ValueError("Unsafe archive name")
              path = PurePosixPath(name)
              if path.is_absolute() or str(path) != name or any(p in {".", "..", ".git", ".venv"} for p in path.parts):
                  raise ValueError("Unsafe archive path")
              return path

          def read_bounded(path, maximum):
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as incoming:
                  before = os.fstat(incoming.fileno())
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > maximum:
                      raise ValueError("Candidate input must be a bounded regular file")
                  raw = incoming.read(maximum + 1)
                  def identity(info):
                      return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_nlink, info.st_size, info.st_mtime_ns, info.st_ctime_ns)
                  if len(raw) != before.st_size or len(raw) > maximum or identity(os.fstat(incoming.fileno())) != identity(before) or identity(path.lstat()) != identity(before):
                      raise ValueError("Candidate input changed during verification")
              return raw

          def committed_tree_hash(expected):
              root = {}
              for name, value in expected.items():
                  current = root
                  parts = PurePosixPath(name).parts
                  for part in parts[:-1]:
                      current = current.setdefault(part, {})
                      if not isinstance(current, dict):
                          raise ValueError("Committed file/directory paths conflict")
                  if parts[-1] in current:
                      raise ValueError("Committed file/directory paths conflict")
                  current[parts[-1]] = value
              def tree(entries):
                  raw = bytearray()
                  for name, value in sorted(entries.items(), key=lambda item: (item[0] + ("/" if isinstance(item[1], dict) else "")).encode("utf-8")):
                      mode, blob = ("40000", tree(value)) if isinstance(value, dict) else value
                      raw.extend(mode.encode("ascii") + b" " + name.encode("utf-8") + b"\0" + bytes.fromhex(blob))
                  return hashlib.sha1(b"tree " + str(len(raw)).encode("ascii") + b"\0" + raw).hexdigest()
              return tree(root)

          def extract_candidate(archive, inventory, destination, candidate_sha, tree_sha, commit_object):
              if not re.fullmatch(r"[0-9a-f]{40}", candidate_sha) or not re.fullmatch(r"[0-9a-f]{40}", tree_sha):
                  raise ValueError("Malformed candidate identity")
              raw = read_bounded(archive, MAX_ARCHIVE)
              inventory_raw = read_bounded(inventory, 2_097_152)
              expected = {}
              for record in inventory_raw.split(b"\0"):
                  if not record:
                      continue
                  metadata, raw_name = record.split(b"\t", 1)
                  mode, kind, blob = metadata.decode("ascii").split(" ")
                  name = raw_name.decode("utf-8", "strict")
                  safe_name(name)
                  if mode not in {"100644", "100755"} or kind != "blob" or not re.fullmatch(r"[0-9a-f]{40}", blob) or name in expected:
                      raise ValueError("Unsupported committed tree member")
                  expected[name] = (mode, blob)
                  if len(expected) > MAX_MEMBERS:
                      raise ValueError("Committed tree exceeded member bound")
              if not expected:
                  raise ValueError("Empty candidate tree")
              if committed_tree_hash(expected) != tree_sha:
                  raise ValueError("Inventory does not bind committed root tree")
              committed = read_bounded(commit_object, 2_097_152)
              if hashlib.sha1(b"commit " + str(len(committed)).encode("ascii") + b"\0" + committed).hexdigest() != candidate_sha or committed.split(b"\n", 1)[0] != b"tree " + tree_sha.encode("ascii"):
                  raise ValueError("Tree does not bind committed candidate object")
              allowed_dirs = {str(parent) for name in expected for parent in PurePosixPath(name).parents if str(parent) != "."}
              validated = []
              seen, total, count = set(), 0, 0
              with tarfile.open(fileobj=io.BytesIO(raw), mode="r:") as package:
                  if package.pax_headers.get("comment") != candidate_sha:
                      raise ValueError("Archive does not bind candidate commit")
                  for member in package:
                      count += 1
                      if count > MAX_MEMBERS or member.mode & 0o7000:
                          raise ValueError("Unsafe archive type or count")
                      name = member.name.rstrip("/") if member.isdir() else member.name
                      safe_name(name)
                      if name in seen:
                          raise ValueError("Duplicate archive member")
                      seen.add(name)
                      if member.isdir():
                          if name not in allowed_dirs:
                              raise ValueError("Uncommitted archive directory")
                          continue
                      if not member.isreg() or member.issparse() or name not in expected:
                          raise ValueError("Archive requires regular committed files only")
                      if not 0 <= member.size <= MAX_FILE:
                          raise ValueError("Archive file exceeded bound")
                      total += member.size
                      if total > MAX_ARCHIVE:
                          raise ValueError("Candidate source exceeded byte bound")
                      incoming = package.extractfile(member)
                      if incoming is None:
                          raise ValueError("Archive file is missing")
                      content = incoming.read(MAX_FILE + 1)
                      if len(content) != member.size:
                          raise ValueError("Archive file size differs")
                      mode, blob = expected[name]
                      if member.mode != (0o755 if mode == "100755" else 0o644):
                          raise ValueError("Archive mode differs from committed executable policy")
                      if hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest() != blob:
                          raise ValueError("Archive bytes differ from committed blob")
                      validated.append((name, mode, content))
              if {name for name, _, _ in validated} != set(expected):
                  raise ValueError("Archive omits committed files")
              destination.mkdir(mode=0o755)
              observed = []
              for name, mode, content in validated:
                  target = destination / name
                  target.parent.mkdir(parents=True, exist_ok=True, mode=0o755)
                  fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  with os.fdopen(fd, "wb") as output:
                      output.write(content)
                      output.flush()
                      os.fsync(output.fileno())
                      os.fchmod(output.fileno(), 0o555 if mode == "100755" else 0o444)
                  observed.append([name, mode, len(content), hashlib.sha256(content).hexdigest()])
              return {"candidate_sha": candidate_sha, "candidate_tree_sha": tree_sha, "archive_sha256": hashlib.sha256(raw).hexdigest(), "source_inventory_sha256": hashlib.sha256(canonical(sorted(observed))).hexdigest(), "files": len(observed), "bytes": total, "read_only_modes": {"100644": "0444", "100755": "0555"}}

          def traversal(path):
              result = []
              for current in reversed((path, *path.parents)):
                  info = current.lstat()
                  result.append({"path": str(current), "mode": oct(stat.S_IMODE(info.st_mode)), "uid": info.st_uid, "gid": info.st_gid, "symlink": stat.S_ISLNK(info.st_mode)})
              return result

          if __name__ == "__main__":
              archive, inventory, destination, receipt = map(Path, sys.argv[1:5])
              result = {"schema": "finance-media-ci-snapshot-v1", "status": "REFUSED", "candidate_sha": sys.argv[5], "candidate_tree_sha": sys.argv[6]}
              try:
                  result["original_workspace_traversal"] = traversal(Path(sys.argv[7]))
                  result.update(extract_candidate(archive, inventory, destination, sys.argv[5], sys.argv[6], Path(sys.argv[8])))
                  result["status"] = "PASS"
              except Exception as error:
                  result["failure_type"] = type(error).__name__
                  result["failure_reason"] = str(error)[:1024]
              write_receipt(receipt, result)
              if result["status"] != "PASS":
                  raise SystemExit("Scoped committed media snapshot refused")
          PY_MEDIA_SNAPSHOT
          sudo "$GITHUB_WORKSPACE/.venv/bin/python" -I -B - "$media_root/sdk-acl.json" "$(id -u)" <<'PY_MEDIA_SDK_ACL'
          import errno
          import hashlib
          import json
          import os
          import pwd
          import stat
          import struct
          import subprocess
          import sys
          from pathlib import Path

          SDK_ROOT = Path("/opt/hostedtoolcache/Python/3.12.14/x64")
          MAX_SDK_ENTRIES = 32768
          ANCESTORS = (Path("/opt"), Path("/opt/hostedtoolcache"), Path("/opt/hostedtoolcache/Python"), Path("/opt/hostedtoolcache/Python/3.12.14"))
          USER_OBJ, USER, GROUP_OBJ, GROUP, MASK, OTHER = 1, 2, 4, 8, 16, 32

          class SdkAclRefusal(ValueError):
              def __init__(self, message, path, stage, **details):
                  super().__init__(message)
                  self.detail = {"path": str(path)[:4096], "path_truncated": len(str(path)) > 4096, "stage": stage, **details}

          def acl_digest(raw):
              return None if raw is None else hashlib.sha256(raw).hexdigest()

          def read_acl(path, name):
              try:
                  return os.getxattr(path, name, follow_symlinks=False)
              except OSError as error:
                  if error.errno == errno.ENODATA:
                      return None
                  raise

          def decode_acl(raw):
              if raw is None:
                  return None
              if len(raw) < 4 or len(raw) > 4096 or (len(raw) - 4) % 8 or struct.unpack_from("<I", raw)[0] != 2:
                  raise ValueError("Unsupported Linux POSIX ACL encoding")
              entries = {}
              for offset in range(4, len(raw), 8):
                  tag, permissions, qualifier = struct.unpack_from("<HHI", raw, offset)
                  if tag not in {USER_OBJ, USER, GROUP_OBJ, GROUP, MASK, OTHER} or permissions > 7 or (tag in {USER, GROUP}) == (qualifier == 0xffffffff):
                      raise ValueError("Malformed Linux POSIX ACL entry")
                  key = (tag, qualifier if tag in {USER, GROUP} else None)
                  if key in entries:
                      raise ValueError("Duplicate Linux POSIX ACL entry")
                  entries[key] = permissions
