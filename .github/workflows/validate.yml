name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      d4_sqlite_f0_probe:
        description: "Run synthetic upstream SQLite F0 inventory diagnostic"
        required: false
        type: boolean
        default: false
      d4_linux_ocr_diagnostic:
        description: "Run the bounded synthetic Ubuntu Linux OCR diagnostic only"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  CANDIDATE_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}

concurrency:
  group: finance-core-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.d4_linux_ocr_diagnostic == true && '-linux-ocr-diagnostic' || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.d4_linux_ocr_diagnostic != true }}

jobs:
  classify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.d4_linux_ocr_diagnostic != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bridge: ${{ steps.scope.outputs.bridge }}
      identity: ${{ steps.identity.outputs.identity }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify candidate checkout identity
        id: identity
        run: python .github/scripts/candidate_identity.py --output "$RUNNER_TEMP/candidate-identity.json" --github-output "$GITHUB_OUTPUT"

      - name: Classify Bridge scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if test "$EVENT_NAME" = "push" || test "$EVENT_NAME" = "workflow_dispatch" || \
             test -z "$BASE_SHA" || \
             printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            echo 'bridge=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_paths="$RUNNER_TEMP/finance-core-changed-paths.txt"
          git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"
          if grep -Eq '^(\.github/|scripts/|pyproject\.toml$|requirements-dev\.txt$|MANIFEST\.in$|plugins/finance-bridge/|native/|finance_core/(openclaw_staging_bridge|application/|intake/(__init__\.py$|macos_vision_receipt_ocr|receipt_ocr_evidence\.py$|tesseract_resources\.py$)|parser_proposals/(__init__\.py$|ai_))|tests/(test_tesseract_pinned_resources_v1\.py$|test_linux_receipt_ocr_acceptance_v1\.py$|test_receipt_ocr_evidence\.py$|test_openclaw_staging_bridge_ocr_production_boundary_v1\.py$|fixtures/linux_receipt_ocr/))' "$changed_paths"; then
            echo 'bridge=true' >> "$GITHUB_OUTPUT"
          else
            echo 'bridge=false' >> "$GITHUB_OUTPUT"
          fi

  quality:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.d4_linux_ocr_diagnostic == true && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify candidate checkout identity
        id: identity
        run: python .github/scripts/candidate_identity.py --output "$RUNNER_TEMP/candidate-identity.json" --github-output "$GITHUB_OUTPUT"

      - name: Initialize bounded Linux OCR diagnostic evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.d4_linux_ocr_diagnostic == true }}
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/d4-linux-ocr-diagnostic"
          cp "$RUNNER_TEMP/candidate-identity.json" \
            "$RUNNER_TEMP/d4-linux-ocr-diagnostic/candidate-identity.json"
          chmod 600 "$RUNNER_TEMP/d4-linux-ocr-diagnostic/candidate-identity.json"

      - name: Reject simultaneous diagnostic modes
        env:
          EVENT_NAME: ${{ github.event_name }}
          LINUX_OCR_DIAGNOSTIC: ${{ inputs.d4_linux_ocr_diagnostic }}
          SQLITE_F0_PROBE: ${{ inputs.d4_sqlite_f0_probe }}
        run: |
          set -euo pipefail
          if test "$EVENT_NAME" = "workflow_dispatch" && \
             test "$LINUX_OCR_DIAGNOSTIC" = "true" && \
             test "$SQLITE_F0_PROBE" = "true"; then
            echo "Linux OCR and SQLite F0 diagnostic modes cannot run together."
            exit 1
          fi

      - name: Install locked development dependencies
        run: "python -I -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt"

      - name: Run Python quality checks
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.d4_linux_ocr_diagnostic != true }}
        run: |
          ruff check --exclude finance_core/resources/preflight/migration_029_preflight.py finance_core tests
          ruff format --check --exclude finance_core/resources/preflight/migration_029_preflight.py finance_core tests
          mypy finance_core

      - name: Verify Linux OCR diagnostic platform
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.d4_linux_ocr_diagnostic == true }}
        run: |
          python - <<'PY_PLATFORM'
          import platform
          import sys
          identity = platform.freedesktop_os_release()
          if (sys.platform, platform.machine(), identity.get("ID"), identity.get("VERSION_ID")) != ("linux", "x86_64", "ubuntu", "24.04"):
              raise SystemExit("Linux OCR diagnostic requires Ubuntu 24.04 x86_64")
          print("Verified Linux OCR diagnostic platform: Ubuntu 24.04 x86_64")
          PY_PLATFORM

      - name: Prepare pinned Linux OCR diagnostic assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.d4_linux_ocr_diagnostic == true }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr
          python -I scripts/prepare_linux_ocr.py \
            --executable /usr/bin/tesseract \
            --destination "$RUNNER_TEMP/linux-ocr"

      - name: Run required Linux OCR diagnostic cases
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.d4_linux_ocr_diagnostic == true }}
        env:
          FINANCE_LINUX_OCR_REQUIRED: "1"
          FINANCE_LINUX_OCR_CONFIG: ${{ runner.temp }}/linux-ocr/ocr_engine.json
          FINANCE_LINUX_OCR_DIAGNOSTIC_DIR: ${{ runner.temp }}/d4-linux-ocr-diagnostic
        run: |
          set +e
          python -I -m pytest -q tests/test_linux_receipt_ocr_acceptance_v1.py \
            --junitxml="$RUNNER_TEMP/linux-ocr-diagnostic.xml" --durations=15
          pytest_rc=$?
          if test -f "$RUNNER_TEMP/linux-ocr-diagnostic.xml"; then
            python -I - "$RUNNER_TEMP/linux-ocr-diagnostic.xml" <<'PY_OCR_DIAGNOSTIC'
          import sys
          import xml.etree.ElementTree as ET
          suites = list(ET.parse(sys.argv[1]).getroot().iter("testsuite"))
          totals = {key: sum(int(suite.get(key, "0")) for suite in suites) for key in ("tests", "skipped", "failures", "errors")}
          if totals["tests"] != 13 or any(totals[key] for key in ("skipped", "failures", "errors")):
              raise SystemExit("Linux OCR diagnostic requires exactly 13 executed cases and zero skips/errors/failures")
          print("Linux OCR diagnostic case inventory:", totals)
          PY_OCR_DIAGNOSTIC
            proof_rc=$?
          else
            echo "Linux OCR diagnostic did not produce a JUnit file."
            proof_rc=1
          fi
          if test "$pytest_rc" -ne 0; then
            exit "$pytest_rc"
          fi
          exit "$proof_rc"

      - name: Preserve bounded Linux OCR diagnostic evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.d4_linux_ocr_diagnostic == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: d4-linux-ocr-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/d4-linux-ocr-diagnostic/
            ${{ runner.temp }}/linux-ocr/preparation-receipt.json
            ${{ runner.temp }}/linux-ocr-preparation-failure.json
            ${{ runner.temp }}/linux-ocr-diagnostic.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Collect synthetic SQLite baseline inventory
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.d4_sqlite_f0_probe == true && inputs.d4_linux_ocr_diagnostic != true }}
        run: |
          mkdir -p "$RUNNER_TEMP/d4-sqlite-f0-probe"
          cp "$RUNNER_TEMP/candidate-identity.json" \
            "$RUNNER_TEMP/d4-sqlite-f0-probe/candidate-identity.json"
          python .github/scripts/d4_sqlite_f0_probe.py \
            --output-dir "$RUNNER_TEMP/d4-sqlite-f0-probe"

      - name: Upload synthetic diagnostic evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.d4_sqlite_f0_probe == true && inputs.d4_linux_ocr_diagnostic != true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: d4-sqlite-f0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d4-sqlite-f0-probe/
          retention-days: 30
          if-no-files-found: warn

  pytest:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.d4_linux_ocr_diagnostic != true }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify Linux validation platform
        run: |
          python - <<'PY_PLATFORM'
          import platform
          import sys
          identity = platform.freedesktop_os_release()
          if (sys.platform, platform.machine(), identity.get("ID"), identity.get("VERSION_ID")) != ("linux", "x86_64", "ubuntu", "24.04"):
              raise SystemExit("Linux validation requires Ubuntu 24.04 x86_64")
          print("Verified Linux validation platform: Ubuntu 24.04 x86_64")
          PY_PLATFORM

      - name: Verify candidate checkout identity
        id: identity
        run: python .github/scripts/candidate_identity.py --output "$RUNNER_TEMP/candidate-identity.json" --github-output "$GITHUB_OUTPUT"

      - name: Install locked development dependencies
        run: "python -I -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt"

      - name: Plan exact test inventory
        run: |
          python .github/scripts/plan_pytest_shards.py plan \
            --baseline .github/scripts/pytest-shard-weights-v2.json \
            --repository-root . \
            --output-dir /tmp/finance-core-shards \
            --shard-count 4

      - name: Run shard
        id: pytest
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set +e
          xargs python -I -m pytest -q \
            --junitxml="/tmp/pytest-results-shard-${SHARD_INDEX}.xml" \
            --durations=25 --durations-min=1.0 \
            < "/tmp/finance-core-shards/shard-${SHARD_INDEX}.txt"
          rc=$?
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Report shard timing
        if: ${{ always() }}
        continue-on-error: true
        env:
          PYTEST_EXIT_CODE: ${{ steps.pytest.outputs.exit_code }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          mkdir -p /tmp/finance-core-timing
          python .github/scripts/report_pytest_timing.py \
            --xml "/tmp/pytest-results-shard-${SHARD_INDEX}.xml" \
            --output "/tmp/finance-core-timing/shard-${SHARD_INDEX}.json" \
            --exit-code "${PYTEST_EXIT_CODE:-1}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload shard timing
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-timing-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/finance-core-timing/
          retention-days: 90
          if-no-files-found: ignore

  bridge:
    needs: classify
    if: ${{ needs.classify.outputs.bridge == 'true' && (github.event_name != 'workflow_dispatch' || inputs.d4_linux_ocr_diagnostic != true) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: macos-15
            runner: macos-15
    name: bridge (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify Linux validation platform
        if: runner.os == 'Linux'
        run: |
          python - <<'PY_PLATFORM'
          import platform
          import sys
          identity = platform.freedesktop_os_release()
          if (sys.platform, platform.machine(), identity.get("ID"), identity.get("VERSION_ID")) != ("linux", "x86_64", "ubuntu", "24.04"):
              raise SystemExit("Linux validation requires Ubuntu 24.04 x86_64")
          print("Verified Linux validation platform: Ubuntu 24.04 x86_64")
          PY_PLATFORM

      - name: Verify candidate checkout identity
        id: identity
        run: python .github/scripts/candidate_identity.py --output "$RUNNER_TEMP/candidate-identity.json" --github-output "$GITHUB_OUTPUT"

      - name: Install locked Python dependencies
        run: |
          python -I -m venv .venv
          .venv/bin/python -I -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt

      - name: Prepare pinned Linux OCR acceptance assets
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr
          .venv/bin/python -I scripts/prepare_linux_ocr.py \
            --executable /usr/bin/tesseract \
            --destination "$RUNNER_TEMP/linux-ocr"

      - name: Require actual Linux receipt OCR acceptance
        if: runner.os == 'Linux'
        env:
          FINANCE_LINUX_OCR_REQUIRED: "1"
          FINANCE_LINUX_OCR_CONFIG: ${{ runner.temp }}/linux-ocr/ocr_engine.json
        run: |
          .venv/bin/python -I -m pytest -q tests/test_linux_receipt_ocr_acceptance_v1.py \
            --junitxml="$RUNNER_TEMP/linux-ocr-acceptance.xml" --durations=15
          .venv/bin/python -I - "$RUNNER_TEMP/linux-ocr-acceptance.xml" <<'PY_OCR_PROOF'
          import sys
          import xml.etree.ElementTree as ET
          suites = list(ET.parse(sys.argv[1]).getroot().iter("testsuite"))
          totals = {key: sum(int(suite.get(key, "0")) for suite in suites) for key in ("tests", "skipped", "failures", "errors")}
          if totals["tests"] < 13 or any(totals[key] for key in ("skipped", "failures", "errors")):
              raise SystemExit("Actual Linux OCR requires at least 13 executed tests and zero skips/errors")
          print("Actual Linux OCR acceptance:", totals)
          PY_OCR_PROOF

      - name: Preserve actual Linux OCR acceptance evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-ocr-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/linux-ocr/preparation-receipt.json
            ${{ runner.temp }}/linux-ocr-preparation-failure.json
            ${{ runner.temp }}/linux-ocr-acceptance.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Set up exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Install Bridge dependencies
        working-directory: plugins/finance-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Bridge
        working-directory: plugins/finance-bridge
        run: |
          npm rebuild fs-ext --foreground-scripts
          npm run build

      - name: Require exact reviewed Bridge build output
        env:
          REVIEWED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --exit-code "$REVIEWED_CHECKOUT_SHA" -- \
            plugins/finance-bridge/dist/src \
            plugins/finance-bridge/dist/build-provenance-v1.json
          test -z "$(git ls-files --others --exclude-standard -- \
            plugins/finance-bridge/dist/src \
            plugins/finance-bridge/dist/build-provenance-v1.json)"

      - name: Test Bridge
        working-directory: plugins/finance-bridge
        env:
          PYTHON_EXECUTABLE: ${{ github.workspace }}/.venv/bin/python
        run: npm test

      - name: Test trusted Bridge capture and reclaim against temporary Core
        working-directory: plugins/finance-bridge
        env:
          FINANCE_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: node test/trusted-ingress-core.mjs

      - name: Test Bridge ingress reconciliation against temporary Core
        working-directory: plugins/finance-bridge
        env:
          FINANCE_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: node test/ingress-reconciliation-core.mjs

  pytest-report:
    needs: pytest
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.d4_linux_ocr_diagnostic != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify candidate checkout identity
        id: identity
        run: python .github/scripts/candidate_identity.py --output "$RUNNER_TEMP/candidate-identity.json" --github-output "$GITHUB_OUTPUT"

      - name: Recreate deterministic shard plan
        run: |
          python .github/scripts/plan_pytest_shards.py plan \
            --baseline .github/scripts/pytest-shard-weights-v2.json \
            --repository-root . \
            --output-dir /tmp/finance-core-shards \
            --shard-count 4

      - name: Download shard timings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: pytest-timing-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/finance-core-shard-timings
          merge-multiple: true

      - name: Aggregate timing report
        run: |
          python .github/scripts/aggregate_pytest_timing.py \
            --shard-dir /tmp/finance-core-shard-timings \
            --plan /tmp/finance-core-shards/plan.json \
            --output /tmp/pytest-timing-v1.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate timing
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-timing-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pytest-timing-v1.json
          retention-days: 90
          if-no-files-found: error

  validate:
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.d4_linux_ocr_diagnostic != true) }}
    needs: [classify, quality, pytest, bridge, pytest-report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Require all applicable validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRIDGE_SCOPE: ${{ needs.classify.outputs.bridge }}
          BRIDGE_RESULT: ${{ needs.bridge.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          REPORT_RESULT: ${{ needs.pytest-report.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$PYTEST_RESULT" = success
          test "$REPORT_RESULT" = success
          if test "$EVENT_NAME" = "pull_request" && test "$BRIDGE_SCOPE" = false; then
            test "$BRIDGE_RESULT" = skipped
          else
            test "$BRIDGE_SCOPE" = true
            test "$BRIDGE_RESULT" = success
          fi

      - name: Bind candidate validation evidence
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: python .github/scripts/candidate_identity.py --summarize --output /tmp/candidate-validation-v1.json

      - name: Upload candidate validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-validation-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/candidate-validation-v1.json
          retention-days: 90
          if-no-files-found: error
